name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: 'production-deployment'
  cancel-in-progress: false

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://my-portfolio-iota-jade-69.vercel.app

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Production Bundle
        run: npm run build

      - name: 🚀 Deployment Success
        run: |
          echo "========================================================"
          echo "🚀 Status: Successfully Verified & Deployed to Production"
          echo "🌐 Live URL: https://my-portfolio-iota-jade-69.vercel.app"
          echo "📦 Environment: Production"
          echo "👤 Author: Rahul Singh Kushwaha"
          echo "========================================================"
